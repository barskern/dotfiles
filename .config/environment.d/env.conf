#
# env.conf
#

# Sets unortodox gopath
GOPATH="$HOME/Programming/golang"

# Used to set terminal for ranger
TERMCMD="/usr/bin/alacritty"

# Used for adding sshkeys to the keychain
SSH_ASKPASS="/usr/lib/ssh/ssh-askpass"

# XDG directories
XDG_CONFIG_HOME="$HOME/.config"
XDG_CACHE_HOME="$HOME/.cache"
XDG_DATA_HOME="$HOME/.local/share"
XDG_STATE_HOME="$HOME/.local/state"

# Set config and data dirs for applications
ADOTDIR="$XDG_DATA_HOME/antigen"
ANSIBLE_HOME="$XDG_DATA_HOME/ansible"
CARGO_HOME="$XDG_DATA_HOME/cargo"
CODEX_HOME="$XDG_DATA_HOME/codex"
DOCKER_CONFIG="$XDG_CONFIG_HOME/docker"
HISTFILE="$XDG_STATE_HOME/shell_history"
IPYTHONDIR="$XDG_CONFIG_HOME/jupyter"
JUPYTER_CONFIG_DIR="$XDG_CONFIG_HOME/jupyter"
LESSHISTFILE="$XDG_STATE_HOMEless/history"
NMBGIT="$XDG_DATA_HOME/notmuch/nmbug"
NOTMUCH_CONFIG="$XDG_CONFIG_HOME/notmuch/config"
NPM_CONFIG_USERCONFIG="$XDG_CONFIG_HOME/npm/config"
NUGET_PACKAGES="$XDG_CACHE_HOME/NuGetPackages"
PSQL_HISTORY="$XDG_DATA_HOME/psql_history"
PYENV_ROOT="$XDG_DATA_HOME/pyenv"
RUSTUP_HOME="$XDG_DATA_HOME/rustup"
STACK_ROOT="$XDG_DATA_HOME/stack"
TASKDATA="$XDG_DATA_HOME/task"
TASKRC="$XDG_CONFIG_HOME/task/taskrc"
TIMEWARRIORDB="$XDG_DATA_HOME/timewarrior"
VAGRANT_HOME="$XDG_DATA_HOME/vagrant"
_JAVA_OPTIONS="-Djava.util.prefs.userRoot=$XDG_CONFIG_HOME/java"

# Common paths
PATH="$PATH:$HOME/.local/bin:$XDG_CONFIG_HOME/scripts:$GOPATH/bin:$XDG_DATA_HOME/cargo/bin:$XDG_DATA_HOME/npm/bin:$XDG_CONFIG_HOME/composer/vendor/bin:$HOME/.gem/ruby/3.0.0/bin:$HOME/.gem/ruby/2.7.0/bin:/opt/cuda/bin"
EDITOR="/usr/bin/nvim"
BROWSER="/usr/bin/firefox"
TERMINAL="/usr/bin/alacritty"

# Used by pacdiff
DIFFPROG="$EDITOR -d"

FZF_DEFAULT_COMMAND="fd --type file --follow"
FZF_ALT_C_COMMAND="fd --type directory --follow"

FZF_CTRL_T_OPTS="--walker-skip .git,node_modules,target,.mozilla,.cache,.local --preview 'bat -n --color=always {}' --bind 'ctrl-/:change-preview-window(down|hidden|)'"
FZF_ALT_C_OPTS="--walker-skip .git,node_modules,target,.mozilla,.cache,.local --preview 'tree -C {}'"

# Set default style for bat
BAT_STYLE="numbers,changes,grid"
